<text xml:space="preserve" text-anchor="start" x="267.5" y="-190.85" font-family="Arial" font-weight="bold" font-size="17.00">Lectura de las etiquetas (notación del material de clase)</text>
<text xml:space="preserve" text-anchor="start" x="267.5" y="-155.35" font-family="Arial" font-weight="bold" font-size="17.00">0 → X, R</text>
<text xml:space="preserve" text-anchor="start" x="335.75" y="-155.35" font-family="Arial" font-size="17.00">: leer 0, escribir X, mover a la derecha.</text>
<text xml:space="preserve" text-anchor="start" x="734.12" y="-154.75" font-family="Arial" font-size="17.00">L: izquierda · R: derecha.</text>
<text xml:space="preserve" text-anchor="start" x="267.5" y="-119.85" font-family="Arial" font-weight="bold" font-size="17.00">0, Y → R</text>
<text xml:space="preserve" text-anchor="start" x="335.75" y="-119.85" font-family="Arial" font-size="17.00">: una regla por símbolo; conserva lo leído.</text>
<text xml:space="preserve" text-anchor="start" x="734.12" y="-119.85" font-family="Cambria Math" font-size="17.00">⊔</text>
<text xml:space="preserve" text-anchor="start" x="746.12" y="-119.85" font-family="Arial" font-size="17.00">: blanco; en los archivos se escribe _.</text>
<text xml:space="preserve" text-anchor="start" x="267.5" y="-83.75" font-family="Arial" font-size="17.00">X marca un 0 procesado; Y marca un 1 procesado.</text>
<text xml:space="preserve" text-anchor="start" x="734.12" y="-84.35" font-family="Arial" font-size="17.00">Σ = {0, 1, 2} · Γ = {0, 1, 2, X, Y, </text>
<text xml:space="preserve" text-anchor="start" x="965.88" y="-84.35" font-family="Cambria Math" font-size="17.00">⊔</text>
<text xml:space="preserve" text-anchor="start" x="977.88" y="-84.35" font-family="Arial" font-size="17.00">}.</text>
<text xml:space="preserve" text-anchor="start" x="267.5" y="-48.25" font-family="Arial" font-size="17.00">Verde: aceptación · Rojo: rechazo · Ocre: ciclo al empezar con 2. Los dos estados finales no tienen salidas.</text>
<text xml:space="preserve" text-anchor="start" x="267.5" y="-12.75" font-family="Arial" font-size="17.00">Cinta con extremo izquierdo en 0: L desde 0 conserva la posición. qRegresa vuelve hasta la X recién escrita.</text>
